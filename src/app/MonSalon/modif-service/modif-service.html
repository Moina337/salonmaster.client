<div class="max-w-4xl mx-auto p-6 bg-white shadow-lg rounded-xl mt-10" *ngIf="service(); else loading">
  <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Modifier le service</h2>

  <!-- Formulaire des informations textuelles -->
  <form (ngSubmit)="modifierService()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700">Nom :</label>
      <input type="text" [(ngModel)]="serviceData.nom" name="nom" 
             class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Description :</label>
      <textarea [(ngModel)]="serviceData.description" name="description" rows="3"
                class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
    </div>

    <div class="w-full sm:w-1/3">
      <label class="block text-sm font-medium text-gray-700">Prix :</label>
      <input type="number" [(ngModel)]="serviceData.prix" name="prix" 
             class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <div class="w-full sm:w-1/3">
      <label class="block text-sm font-medium text-gray-700">Durée (min) :</label>
      <input type="number" [(ngModel)]="serviceData.duree" name="duree" 
             class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <button type="submit" 
            class="w-full sm:w-auto px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
      Enregistrer les informations
    </button>
  </form>

  <hr class="my-8 border-gray-200">

  <!-- Section de gestion des images -->
  <h3 class="text-xl font-semibold text-gray-800 mb-4">Images du service</h3>
  
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    @for (img of service()?.images; track img.nom) {
      <div class="relative group bg-gray-50 p-2 rounded-lg border border-gray-200 shadow-sm">
        <!-- Affichage de l'image -->
        <div class="h-40 w-full overflow-hidden rounded-md bg-gray-200">
          <img [src]="'http://localhost:8080/uploads/' + img.nom" 
               class="h-full w-full object-cover transform group-hover:scale-105 transition duration-300">
        </div>
        
        <div class="mt-3 flex justify-between gap-2">
          <!-- Bouton Modifier -->
          <input type="file" #fileInput (change)="onImageChange(img.id, $event)" hidden>
          <button type="button" (click)="fileInput.click()" 
                  class="flex-1 text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 py-1.5 rounded transition">
            🔄 Modifier
          </button>
          
          <!-- Bouton Supprimer -->
          <button type="button" (click)="supprimerImage(img.id)" 
                  class="flex-1 text-xs bg-red-100 hover:bg-red-200 text-red-600 py-1.5 rounded transition">
            🗑️ Supprimer
          </button>
        </div>
      </div>
    }
  </div>
</div>

<!-- Loading Template -->
<ng-template #loading>
  <div class="flex justify-center items-center h-64">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
    <p class="ml-4 text-gray-500 font-medium">Chargement des données...</p>
  </div>
</ng-template>
