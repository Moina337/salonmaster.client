<div class="max-w-3xl mx-auto mt-10 p-8 bg-white shadow-2xl rounded-3xl border border-gray-50">
  <div class="flex items-center gap-4 mb-8">
    <div class="p-3 bg-indigo-100 rounded-2xl text-indigo-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      </svg>
    </div>
    <h2 class="text-3xl font-extrabold text-gray-800">Modifier mon Salon</h2>
  </div>

  <form (ngSubmit)="mettreAJour()" #form="ngForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
    
    <!-- Nom du Salon (Pleine largeur) -->
    <div class="md:col-span-2">
      <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Nom de l'établissement</label>
      <input type="text" name="nom" [(ngModel)]="salonData.nom" required
        class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500 transition shadow-inner">
    </div>

    <!-- Adresse -->
    <div class="md:col-span-2">
      <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Adresse complète</label>
      <input type="text" name="adresse" [(ngModel)]="salonData.adresse" required
        class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500 transition shadow-inner">
    </div>

    <!-- Latitude -->
    <div>
      <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Latitude</label>
      <input type="number" step="any" name="latitude" [(ngModel)]="salonData.latitude"
        class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500 shadow-inner">
    </div>

    <!-- Longitude -->
    <div>
      <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Longitude</label>
      <input type="number" step="any" name="longitude" [(ngModel)]="salonData.longitude"
        class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500 shadow-inner">
    </div>

    <!-- Description -->
    <div class="md:col-span-2">
      <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Description du salon</label>
      <textarea name="description" [(ngModel)]="salonData.description" rows="4"
        class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500 shadow-inner"></textarea>
    </div>

    <!-- Bouton Enregistrer -->
    <div class="md:col-span-2 mt-4">
      <button type="submit" [disabled]="!form.valid"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-5 rounded-2xl shadow-xl shadow-indigo-100 transition-all active:scale-95 disabled:bg-gray-300">
        ENREGISTRER LES MODIFICATIONS
      </button>
    </div>
  </form>
</div>
