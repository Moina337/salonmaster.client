<!-- modifier-salon.component.html -->
<!-- Style : BarberOS luxury editorial — 100% Tailwind | bindings exacts conservés -->

<div class="max-w-3xl mx-auto  px-4 pb-16">

  <!-- En-tête -->
  <div class="mb-8">
    <a href="/mon-salon"
       class="inline-flex items-center gap-1.5 text-xs text-stone-400
              hover:text-amber-600 transition-colors mb-5 font-medium">
      <svg width="13" height="13" fill="none" stroke="currentColor"
           stroke-width="2" viewBox="0 0 24 24">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      Retour à mon salon
    </a>

    <div class="flex items-center gap-4">
      <div class="w-10 h-10 bg-stone-900 flex items-center justify-center shrink-0">
        <svg width="16" height="16" fill="none" stroke="#C9A96E"
             stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
          <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </div>
      <div>
        <p class="text-xs font-semibold uppercase tracking-widest text-amber-600 mb-0.5">
          Administration
        </p>
        <h2 class="font-serif text-2xl font-bold text-stone-900 leading-tight">
          Modifier mon salon
        </h2>
      </div>
    </div>
  </div>

  <!-- FORMULAIRE -->
  <form (ngSubmit)="mettreAJour()" #form="ngForm"
        class="bg-white border border-stone-200 shadow-sm divide-y divide-stone-100">

    <!-- ── Nom — salonData.nom ── -->
    <div class="px-6 py-5 md:col-span-2">
      <label class="block text-[10px] font-semibold uppercase tracking-widest
                    text-stone-400 mb-2">
        Nom de l'établissement <span class="text-amber-500">*</span>
      </label>
      <input
        type="text"
        name="nom"
        [(ngModel)]="salonData.nom"
        required
        placeholder="ex : Salon Atlas"
        class="w-full px-4 py-3 border border-stone-200 bg-stone-50 text-sm
               text-stone-900 placeholder-stone-300 outline-none
               focus:border-amber-400 focus:ring-2 focus:ring-amber-100
               focus:bg-white transition-all duration-200"
      />
    </div>

    <!-- ── Adresse — salonData.adresse ── -->
    <div class="px-6 py-5 md:col-span-2">
      <label class="block text-[10px] font-semibold uppercase tracking-widest
                    text-stone-400 mb-2">
        Adresse complète <span class="text-amber-500">*</span>
      </label>
      <div class="relative">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4
                    text-stone-300 pointer-events-none"
             fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <input
          type="text"
          name="adresse"
          [(ngModel)]="salonData.adresse"
          required
          placeholder="ex : 12 Avenue Léopold Sédar Senghor, Plateau, Dakar"
          class="w-full pl-11 pr-4 py-3 border border-stone-200 bg-stone-50
                 text-sm text-stone-900 placeholder-stone-300 outline-none
                 focus:border-amber-400 focus:ring-2 focus:ring-amber-100
                 focus:bg-white transition-all duration-200"
        />
      </div>
    </div>

    <!-- ── Latitude + Longitude — salonData.latitude | salonData.longitude ── -->
    <div class="px-6 py-5 grid grid-cols-1 sm:grid-cols-2 gap-4">

      <div>
        <label class="block text-[10px] font-semibold uppercase tracking-widest
                      text-stone-400 mb-2">
          Latitude
        </label>
        <input
          type="number"
          step="any"
          name="latitude"
          [(ngModel)]="salonData.latitude"
          placeholder="ex : 14.6928"
          class="w-full px-4 py-3 border border-stone-200 bg-stone-50 text-sm
                 text-stone-900 placeholder-stone-300 outline-none
                 focus:border-amber-400 focus:ring-2 focus:ring-amber-100
                 focus:bg-white transition-all duration-200 tabular-nums"
        />
        <p class="text-[10px] text-stone-300 mt-1.5">Coordonnée GPS Nord/Sud</p>
      </div>

      <div>
        <label class="block text-[10px] font-semibold uppercase tracking-widest
                      text-stone-400 mb-2">
          Longitude
        </label>
        <input
          type="number"
          step="any"
          name="longitude"
          [(ngModel)]="salonData.longitude"
          placeholder="ex : -17.4467"
          class="w-full px-4 py-3 border border-stone-200 bg-stone-50 text-sm
                 text-stone-900 placeholder-stone-300 outline-none
                 focus:border-amber-400 focus:ring-2 focus:ring-amber-100
                 focus:bg-white transition-all duration-200 tabular-nums"
        />
        <p class="text-[10px] text-stone-300 mt-1.5">Coordonnée GPS Est/Ouest</p>
      </div>

    </div>

    <!-- ── Description — salonData.description ── -->
    <div class="px-6 py-5">
      <label class="block text-[10px] font-semibold uppercase tracking-widest
                    text-stone-400 mb-2">
        Description du salon
      </label>
      <textarea
        name="description"
        [(ngModel)]="salonData.description"
        rows="4"
        placeholder="Décrivez votre salon, votre style, votre expertise…"
        class="w-full px-4 py-3 border border-stone-200 bg-stone-50 text-sm
               text-stone-900 placeholder-stone-300 outline-none resize-none
               focus:border-amber-400 focus:ring-2 focus:ring-amber-100
               focus:bg-white transition-all duration-200 leading-relaxed"
      ></textarea>
    </div>

    <!-- ── Actions ── -->
    <div class="px-6 py-5 bg-stone-50 flex items-center justify-between gap-4">
      <a href="/mon-salon"
         class="text-sm text-stone-400 hover:text-stone-600
                transition-colors font-medium">
        Annuler
      </a>

      <!-- [disabled]="!form.valid" -->
      <button
        type="submit"
        [disabled]="!form.valid"
        class="inline-flex items-center gap-2 px-8 py-3 bg-stone-900 text-stone-50
               text-xs font-semibold uppercase tracking-widest
               hover:bg-amber-500 hover:text-stone-900
               disabled:bg-stone-200 disabled:text-stone-400 disabled:cursor-not-allowed
               transition-all duration-300 active:scale-95">
        <svg width="14" height="14" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v14a2 2 0 01-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Enregistrer les modifications
      </button>
    </div>

  </form>

</div>
