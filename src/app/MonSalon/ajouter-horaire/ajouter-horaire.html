<div class="max-w-2xl mx-auto mt-10 space-y-6">
  
  <!-- Formulaire de saisie -->
  <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
    <h3 class="text-lg font-bold mb-4">Ajouter un horaire</h3>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Jour</label>
        <select [(ngModel)]="currentHoraire.jour" class="w-full p-3 bg-gray-50 rounded-xl border-none">
          @for (j of jours; track j) { <option [value]="j">{{j}}</option> }
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Heures</label>
        <div class="flex items-center gap-2">
          <input type="time" [(ngModel)]="currentHoraire.heureOuverture" class="p-3 bg-gray-50 rounded-xl border-none w-full">
          <span>-</span>
          <input type="time" [(ngModel)]="currentHoraire.heureFermeture" class="p-3 bg-gray-50 rounded-xl border-none w-full">
        </div>
      </div>
      <button (click)="ajouterALaListe()" class="bg-blue-600 text-white p-3 rounded-xl font-bold hover:bg-blue-700 transition">
        Ajouter à la liste
      </button>
    </div>
  </div>

  <!-- Liste récapitulative -->
  @if (listeHoraires().length > 0) {
    <div class="bg-white rounded-3xl shadow-lg border border-gray-100 overflow-hidden">
      <table class="w-full text-left">
        <thead class="bg-gray-50 text-gray-400 text-xs uppercase">
          <tr>
            <th class="p-4">Jour</th>
            <th class="p-4">Ouverture</th>
            <th class="p-4">Fermeture</th>
            <th class="p-4 text-right">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          @for (h of listeHoraires(); track $index) {
            <tr class="hover:bg-gray-50 transition">
              <td class="p-4 font-bold text-gray-700">{{ h.jour }}</td>
              <td class="p-4 text-gray-600">{{ h.heureOuverture }}</td>
              <td class="p-4 text-gray-600">{{ h.heureFermeture }}</td>
              <td class="p-4 text-right">
                <button (click)="retirerDeLaListe($index)" class="text-red-500 hover:text-red-700 font-medium">Supprimer</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
      
      <!-- Bouton d'envoi final -->
      <div class="p-6 bg-gray-50 border-t border-gray-100">
        <button (click)="enregistrerTout()" class="w-full bg-black text-white py-4 rounded-2xl font-bold shadow-xl hover:scale-[1.02] transition">
          Enregistrer les {{ listeHoraires().length }} horaires
        </button>
      </div>
    </div>
  }
</div>
