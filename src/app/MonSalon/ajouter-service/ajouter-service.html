<div class="max-w-2xl mx-auto mt-10 p-8 bg-white shadow-lg rounded-xl border border-gray-100">
  <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Ajouter un Nouveau Service</h2>

  <form (ngSubmit)="ajouterService()" #serviceForm="ngForm" class="space-y-5">
    
    <!-- Nom du Service -->
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">Nom du service</label>
      <input 
        type="text" 
        name="nom" 
        [(ngModel)]="serviceData.nom" 
        required 
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
        placeholder="Ex: Coupe de cheveux">
    </div>

    <!-- Description -->
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">Description</label>
      <textarea 
        name="description" 
        [(ngModel)]="serviceData.description" 
        rows="3"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
        placeholder="Décrivez votre service..."></textarea>
    </div>

    <!-- Prix et Durée -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Prix (€)</label>
        <input 
          type="number" 
          name="prix" 
          [(ngModel)]="serviceData.prix" 
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Durée</label>
        <input 
          type="text" 
          name="duree" 
          [(ngModel)]="serviceData.duree" 
          required
          placeholder="Ex: 45 min"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
    </div>

    <!-- Upload Images -->
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">Images du service</label>
      <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg hover:border-blue-400 transition">
        <div class="space-y-1 text-center">
          <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div class="flex text-sm text-gray-600">
            <label class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500">
              <span>Téléverser des fichiers</span>
              <input type="file" class="sr-only" (change)="onFileSelected($event)" multiple accept="image/*">
            </label>
            <p class="pl-1">ou glisser-déposer</p>
          </div>
          <p class="text-xs text-gray-500">PNG, JPG jusqu'à 10MB</p>
        </div>
      </div>

      <!-- Liste des fichiers (Badge style) -->
      @if (selectedImages.length > 0) {
        <div class="mt-4 flex flex-wrap gap-2">
          @for (file of selectedImages; track file.name) {
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800 border border-blue-200">
              {{ file.name }}
            </span>
          }
        </div>
      }
    </div>

    <!-- Bouton submit -->
    <button 
      type="submit" 
      [disabled]="!serviceForm.form.valid || selectedImages.length === 0"
      class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-gray-400 disabled:cursor-not-allowed transition duration-200">
      Enregistrer le service
    </button>

  </form>
</div>
