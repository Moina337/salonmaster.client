<!-- ajouter-service.component.html -->
<!-- Style : BarberOS luxury editorial — 100% Tailwind | bindings exacts conservés -->

<div class="max-w-2xl mx-auto mt-10 px-4 pb-16">

  <!-- En-tête -->
  <div class="mb-8">
    <a href="/mon-salon"
       class="inline-flex items-center gap-1.5 text-xs text-stone-400
              hover:text-amber-600 transition-colors mb-5 font-medium">
      <svg width="13" height="13" fill="none" stroke="currentColor"
           stroke-width="2" viewBox="0 0 24 24">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      Retour à mon salon
    </a>

    <div class="flex items-center gap-4">
      <div class="w-10 h-10 bg-stone-900 flex items-center justify-center shrink-0">
        <svg width="16" height="16" fill="none" stroke="#C9A96E"
             stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </div>
      <div>
        <p class="text-xs font-semibold uppercase tracking-widest text-amber-600 mb-0.5">
          Administration
        </p>
        <h2 class="font-serif text-2xl font-bold text-stone-900 leading-tight">
          Ajouter un service
        </h2>
      </div>
    </div>
  </div>

  <!-- FORMULAIRE -->
  <form (ngSubmit)="ajouterService()" #serviceForm="ngForm"
        class="bg-white border border-stone-200 shadow-sm divide-y divide-stone-100">

    <!-- ── Nom — serviceData.nom ── -->
    <div class="px-6 py-5">
      <label class="block text-[10px] font-semibold uppercase tracking-widest
                    text-stone-400 mb-2">
        Nom du service <span class="text-amber-500">*</span>
      </label>
      <input
        type="text"
        name="nom"
        [(ngModel)]="serviceData.nom"
        required
        placeholder="ex : Coupe classique, Rasage traditionnel…"
        class="w-full px-4 py-3 border border-stone-200 bg-stone-50 text-sm
               text-stone-900 placeholder-stone-300 outline-none
               focus:border-amber-400 focus:ring-2 focus:ring-amber-100
               focus:bg-white transition-all duration-200"
      />
    </div>

    <!-- ── Description — serviceData.description ── -->
    <div class="px-6 py-5">
      <label class="block text-[10px] font-semibold uppercase tracking-widest
                    text-stone-400 mb-2">
        Description
      </label>
      <textarea
        name="description"
        [(ngModel)]="serviceData.description"
        rows="3"
        placeholder="Décrivez votre service…"
        class="w-full px-4 py-3 border border-stone-200 bg-stone-50 text-sm
               text-stone-900 placeholder-stone-300 outline-none resize-none
               focus:border-amber-400 focus:ring-2 focus:ring-amber-100
               focus:bg-white transition-all duration-200 leading-relaxed"
      ></textarea>
    </div>

    <!-- ── Prix + Durée — serviceData.prix | serviceData.duree ── -->
    <div class="px-6 py-5 grid grid-cols-1 md:grid-cols-2 gap-4">

      <!-- serviceData.prix -->
      <div>
        <label class="block text-[10px] font-semibold uppercase tracking-widest
                      text-stone-400 mb-2">
          Prix <span class="text-amber-500">*</span>
        </label>
        <div class="relative">
          <input
            type="number"
            name="prix"
            [(ngModel)]="serviceData.prix"
            required
            placeholder="0"
            class="w-full pl-4 pr-16 py-3 border border-stone-200 bg-stone-50
                   text-sm text-stone-900 placeholder-stone-300 outline-none
                   focus:border-amber-400 focus:ring-2 focus:ring-amber-100
                   focus:bg-white transition-all duration-200 tabular-nums"
          />
          <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs
                       font-semibold text-stone-400 pointer-events-none">
            XOF
          </span>
        </div>
      </div>

      <!-- serviceData.duree -->
      <div>
        <label class="block text-[10px] font-semibold uppercase tracking-widest
                      text-stone-400 mb-2">
          Durée <span class="text-amber-500">*</span>
        </label>
        <div class="relative">
          <input
            type="text"
            name="duree"
            [(ngModel)]="serviceData.duree"
            required
            placeholder="ex : 45"
            class="w-full pl-4 pr-14 py-3 border border-stone-200 bg-stone-50
                   text-sm text-stone-900 placeholder-stone-300 outline-none
                   focus:border-amber-400 focus:ring-2 focus:ring-amber-100
                   focus:bg-white transition-all duration-200 tabular-nums"
          />
          <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs
                       font-semibold text-stone-400 pointer-events-none">
            min
          </span>
        </div>
      </div>

    </div>

    <!-- ── Upload images — (change)="onFileSelected($event)" ── -->
    <div class="px-6 py-5">
      <label class="block text-[10px] font-semibold uppercase tracking-widest
                    text-stone-400 mb-3">
        Images du service
      </label>

      <!-- Zone drop — input type="file" multiple accept="image/*" -->
      <label class="flex flex-col items-center justify-center gap-3 p-8
                    border-2 border-dashed border-stone-200 bg-stone-50
                    hover:border-amber-400 hover:bg-amber-50/30
                    transition-all duration-200 cursor-pointer group"
             [class.border-amber-400]="selectedImages.length > 0"
             [class.bg-amber-50]="selectedImages.length > 0">

        <div class="w-12 h-12 bg-white border border-stone-200 flex items-center
                    justify-center group-hover:border-amber-300 transition-colors">
          <svg width="22" height="22" fill="none" stroke="currentColor"
               stroke-width="1.5" class="text-stone-400" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>

        <div class="text-center">
          <p class="text-sm font-medium text-stone-700">
            <span class="text-amber-600 font-semibold">Téléverser des fichiers</span>
            ou glisser-déposer
          </p>
          <p class="text-xs text-stone-400 mt-1">PNG, JPG jusqu'à 10 MB</p>
        </div>

        <!-- (change)="onFileSelected($event)" multiple accept="image/*" -->
        <input
          type="file"
          class="sr-only"
          (change)="onFileSelected($event)"
          multiple
          accept="image/*"
        />
      </label>

      <!-- Badges fichiers — selectedImages | file.name -->
      <!-- @if (selectedImages.length > 0) -->
      @if (selectedImages.length > 0) {
        <div class="mt-4 flex flex-wrap gap-2">
          <!-- @for (file of selectedImages; track file.name) -->
          @for (file of selectedImages; track file.name) {
            <span class="inline-flex items-center gap-1.5 px-3 py-1 text-xs
                         font-medium bg-amber-50 text-amber-700
                         border border-amber-200">
              <svg width="10" height="10" fill="none" stroke="currentColor"
                   stroke-width="2" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
              {{ file.name }}
            </span>
          }
        </div>
      }
    </div>

    <!-- ── Actions ── -->
    <div class="px-6 py-5 bg-stone-50 flex items-center justify-between gap-4">
      <a href="/mon-salon"
         class="text-sm text-stone-400 hover:text-stone-600
                transition-colors font-medium">
        Annuler
      </a>

      <!-- [disabled]="!serviceForm.form.valid || selectedImages.length === 0" -->
      <button
        type="submit"
        [disabled]="!serviceForm.form.valid || selectedImages.length === 0"
        class="inline-flex items-center gap-2 px-8 py-3 bg-stone-900 text-stone-50
               text-xs font-semibold uppercase tracking-widest
               hover:bg-amber-500 hover:text-stone-900
               disabled:bg-stone-200 disabled:text-stone-400 disabled:cursor-not-allowed
               transition-all duration-300 active:scale-95">
        <svg width="14" height="14" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v14a2 2 0 01-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Enregistrer le service
      </button>
    </div>

  </form>

</div>
