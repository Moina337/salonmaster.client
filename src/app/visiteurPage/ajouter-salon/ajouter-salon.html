<form (ngSubmit)="ajouterSalon()" #f="ngForm" class="space-y-4">

  <!-- Nom salon -->
  <input
    type="text"
    name="nomSalon"
    [(ngModel)]="salonData.nomSalon"
    placeholder="Nom du salon"
    class="w-full border p-2 rounded"
    required
  />

  <!-- Email -->
  <input
    type="email"
    name="email"
    [(ngModel)]="salonData.email"
    placeholder="Email"
    class="w-full border p-2 rounded"
    required
  />

  <!-- Mot de passe -->
  <input
    type="password"
    name="motDePasse"
    [(ngModel)]="salonData.motDePasse"
    placeholder="Mot de passe"
    class="w-full border p-2 rounded"
    required
  />

  <!-- Catégorie (ENUM) -->
  <select
    name="categorie"
    [(ngModel)]="salonData.categorie"
    class="w-full border p-2 rounded"
    required
  >
    <option [ngValue]="undefined">Choisir une catégorie</option>

    <option [ngValue]="'FEMME'">
      Femme
    </option>

    <option [ngValue]="'HOMME'">
      Homme
    </option>

    <option [ngValue]="'HOMME_FEMME'">
      Homme & Femme
    </option>
  </select>

  <!-- Submit -->
  <button
    type="submit"
    class="w-full bg-black text-white py-2 rounded hover:bg-gray-800"
  >
    Créer le salon
  </button>

</form>
