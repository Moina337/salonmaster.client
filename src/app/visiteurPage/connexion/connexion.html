<div class="min-h-screen flex items-center justify-center bg-stone-50 px-4">

  <div class="w-full max-w-md bg-white shadow-sm border border-stone-200 p-8 space-y-6">

    <!-- Header -->
    <div class="text-center">
      <h1 class="text-2xl font-semibold text-stone-900">
        Connexion
      </h1>
      <p class="text-sm text-stone-400 mt-1">
        Accédez à votre espace salon
      </p>
    </div>

    <!-- Erreur -->
    <div *ngIf="errorMessage"
         class="bg-red-50 border border-red-200 text-red-600 text-sm p-3">
      {{ errorMessage }}
    </div>

    <!-- Form -->
    <form (ngSubmit)="seConnecter()" class="space-y-5">

      <!-- Email -->
      <div>
        <label class="text-xs font-semibold text-stone-500 uppercase tracking-wide">
          Email
        </label>
        <input
          type="email"
          [(ngModel)]="connexionDTO.email"
          name="email"
          required
          class="mt-1 w-full border border-stone-200 px-3 py-2 text-sm focus:outline-none focus:border-amber-400"
          placeholder="exemple@gmail.com"
        />
      </div>

      <!-- Mot de passe -->
      <div>
        <label class="text-xs font-semibold text-stone-500 uppercase tracking-wide">
          Mot de passe
        </label>
        <input
          type="password"
          [(ngModel)]="connexionDTO.motDePasse"
          name="password"
          required
          class="mt-1 w-full border border-stone-200 px-3 py-2 text-sm focus:outline-none focus:border-amber-400"
          placeholder="********"
        />
      </div>

     

      <!-- Bouton -->
      <button
        type="submit"
        class="w-full bg-amber-400 hover:bg-amber-300 text-stone-900 font-semibold py-2 text-sm transition">
        Se connecter
      </button>

    </form>

    <!-- Footer -->
    <div class="text-center text-xs text-stone-400">
      Pas encore de compte ?
      <a routerLink="/inscription"
         class="text-amber-600 hover:underline font-medium">
        Créer un salon
      </a>
    </div>

  </div>
</div>
