<div class="min-h-screen flex items-center justify-center bg-stone-50 px-4">

  <div class="w-full max-w-md bg-white shadow-sm border border-stone-200 p-8 space-y-6">

    <!-- Header -->
    <div class="text-center">
      <h1 class="text-2xl font-semibold text-stone-900">
        Connexion
      </h1>
      <p class="text-sm text-stone-400 mt-1">
        Accédez à votre espace salon
      </p>
    </div>

    <!-- Erreur globale -->
    @if (errorMessage) {
      <div class="bg-red-50 border border-red-200 text-red-600 text-sm p-3">
        {{ errorMessage }}
      </div>
    }

    <!-- Form -->
    <form #form="ngForm" (ngSubmit)="seConnecter()" class="space-y-5">

      <!-- Email -->
      <div>
        <label class="text-xs font-semibold text-stone-500 uppercase tracking-wide">
          Email
        </label>

        <input
          type="email"
          [(ngModel)]="connexionDTO.email"
          name="email"
          required
          email
          #email="ngModel"
          (input)="errorMessage=''"
          class="mt-1 w-full border border-stone-200 px-3 py-2 text-sm focus:outline-none focus:border-amber-400"
          placeholder="exemple@gmail.com"
        />

        @if (email.invalid && email.touched) {
          <p class="text-xs text-red-500 mt-1">
            Email invalide
          </p>
        }
      </div>

      <!-- Mot de passe -->
      <div>
        <label class="text-xs font-semibold text-stone-500 uppercase tracking-wide">
          Mot de passe
        </label>

        <input
          type="password"
          [(ngModel)]="connexionDTO.motDePasse"
          name="motDePasse"
          required
          #password="ngModel"
          (input)="errorMessage=''"
          class="mt-1 w-full border border-stone-200 px-3 py-2 text-sm focus:outline-none focus:border-amber-400"
          placeholder="********"
        />

        @if (password.invalid && password.touched) {
          <p class="text-xs text-red-500 mt-1">
            Mot de passe requis
          </p>
        }
      </div>

      <!-- Bouton -->
      <button
        type="submit"
        [disabled]="form.invalid || loading"
        class="w-full bg-amber-400 hover:bg-amber-300 disabled:bg-stone-200 text-stone-900 font-semibold py-2 text-sm transition flex items-center justify-center"
      >
        @if (loading) {
          <span class="flex items-center gap-2">
            <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"></circle>
              <path d="M4 12a8 8 0 018-8v8z" fill="currentColor" class="opacity-75"></path>
            </svg>
            Connexion...
          </span>
        } @else {
          Connexion
        }
      </button>

    </form>

    <!-- Footer -->
    <div class="text-center text-xs text-stone-400">
      Pas encore de compte ?
      <a routerLink="/inscription"
         class="text-amber-600 hover:underline font-medium">
        Créer un salon
      </a>
    </div>

  </div>
</div>
