<div class="flex h-screen w-full bg-[#F8F6F2] overflow-hidden">
  <!-- Bouton hamburger mobile visible quand menu fermé -->
  <button *ngIf="!isMobileMenuOpen" (click)="toggleMenu()" class="fixed top-4 left-4 z-50 p-2 rounded-md bg-white shadow md:hidden" aria-label="Ouvrir le menu">
    <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Bouton fermeture (croix) visible quand menu ouvert -->
  <button *ngIf="isMobileMenuOpen" (click)="toggleMenu()" class="fixed top-4 left-4 z-[60] p-2 rounded-md bg-white shadow md:hidden" aria-label="Fermer le menu">
    <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>
  
  <!-- Overlay Mobile -->
  <div *ngIf="isMobileMenuOpen" 
       (click)="isMobileMenuOpen = false" 
       class="fixed inset-0 bg-black/50 z-40 md:hidden">
  </div>

  <!-- SIDEBAR -->
  <aside [class.translate-x-0]="isMobileMenuOpen"
         [class.-translate-x-full]="!isMobileMenuOpen"
         class="fixed inset-y-0 left-0 z-50 w-64 bg-[#0F0E0C] transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0 flex flex-col">
    
    <!-- Logo -->
    <div class="p-6 flex items-center gap-3">
      <div class="w-8 h-8 bg-[#C9A96E]/10 rounded flex items-center justify-center">
        <svg class="w-5 h-5 stroke-[#C9A96E]" viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M14 2C14 2 12 6 12 10C12 14 14 18 14 22M10 2C10 2 12 6 12 10C12 14 10 18 10 22"></path></svg>
      </div>
      <span class="text-white font-bold text-xl tracking-tight">Barber<span class="text-[#C9A96E]">OS</span></span>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-4 overflow-y-auto space-y-6">
      <div>
        <p class="text-[10px] uppercase tracking-widest text-gray-500 px-3 mb-4">Principal</p>
        <div class="space-y-1">
          <a routerLink="/dashboard" routerLinkActive="bg-[#C9A96E]/10 text-[#C9A96E]" 
             class="flex items-center gap-3 px-3 py-2.5 text-gray-400 rounded-lg hover:bg-white/5 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
            <span class="text-sm font-medium">Tableau de bord</span>
          </a>
          <a routerLink="/mon-salon" routerLinkActive="bg-[#C9A96E]/10 text-[#C9A96E]" 
             class="flex items-center gap-3 px-3 py-2.5 text-gray-400 rounded-lg hover:bg-white/5 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 21c-4-4-7-7.5-7-11a7 7 0 0114 0c0 3.5-3 7-7 11z"></path><circle cx="12" cy="10" r="2"></circle></svg>
            <span class="text-sm font-medium">Mon salon</span>
          </a>
        </div>
      </div>

      <div>
        <p class="text-[10px] uppercase tracking-widest text-gray-500 px-3 mb-4">Gestion</p>
        <div class="space-y-1">
          <a routerLink="/mon-salon/liste-rdv" routerLinkActive="bg-[#C9A96E]/10 text-[#C9A96E]" 
             class="flex items-center gap-3 px-3 py-2.5 text-gray-400 rounded-lg hover:bg-white/5 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
            <span class="text-sm font-medium">Rendez-vous</span>
          </a>
        </div>
      </div>
    </nav>

    <!-- Footer -->
    <div class="p-4 bg-[#161512] flex items-center gap-3">
      <div class="w-9 h-9 bg-[#C9A96E] rounded-full flex items-center justify-center font-bold text-[#0F0E0C]">MN</div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-semibold text-gray-200 truncate">Mamadou Ndiaye</p>
        <p class="text-[10px] text-gray-500">Propriétaire</p>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    
    <!-- Topbar -->
    <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-4 md:px-8 flex-shrink-0">
      <div class="flex items-center gap-4">
        <button (click)="toggleMenu()" class="p-2 -ml-2 text-gray-600 md:hidden">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div>
          <h1 class="text-base font-semibold text-gray-900">Tableau de bord</h1>
          <p class="text-[10px] text-gray-500 hidden sm:block">Mardi 1er avril 2025 · Bonjour, Mamadou</p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <button class="relative p-2 text-gray-400 hover:text-[#C9A96E] transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 01-3.46 0"></path></svg>
          <span class="absolute top-2 right-2 w-2 h-2 bg-[#C9A96E] rounded-full border-2 border-white"></span>
        </button>
        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-[10px] font-bold">MN</div>
      </div>
    </header>

    <!-- Page Content Area -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
